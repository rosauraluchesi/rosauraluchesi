name: CI Pipeline
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install deps
        run: |
          if [ -f go.mod ]; then
            go mod download
          else
            echo "No go.mod found; skipping dependency install"
          fi

      - name: Lint
        run: |
          if [ -f go.mod ]; then
            go vet ./...
          else
            echo "No go.mod found; skipping lint"
          fi

      - name: Build
        run: |
          if [ -f go.mod ]; then
            go build ./...
          else
            echo "No go.mod found; skipping build"
          fi

      - name: Test
        run: |
          if [ -f go.mod ]; then
            go test ./...
          else
            echo "No go.mod found; skipping tests"
          fi

      - name: Summary
        if: always()
        run: |
          echo "CI pipeline finished for Go ${{ matrix.go }}." >> "$GITHUB_STEP_SUMMARY"